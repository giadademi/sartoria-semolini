<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <!-- Mappa illustrativa statica (decorativa, non in scala): nessun servizio esterno -->
  <rect width="800" height="600" fill="#EFE7D8"/>

  <!-- isolati -->
  <g fill="#E6DCC8">
    <rect x="20" y="20" width="150" height="110" rx="6"/>
    <rect x="200" y="20" width="170" height="110" rx="6"/>
    <rect x="400" y="20" width="120" height="70" rx="6"/>
    <rect x="560" y="20" width="220" height="130" rx="6"/>
    <rect x="20" y="170" width="110" height="140" rx="6"/>
    <rect x="160" y="170" width="160" height="90" rx="6"/>
    <rect x="460" y="190" width="130" height="120" rx="6"/>
    <rect x="620" y="190" width="160" height="80" rx="6"/>
    <rect x="20" y="350" width="150" height="100" rx="6"/>
    <rect x="200" y="330" width="120" height="120" rx="6"/>
    <rect x="470" y="350" width="140" height="110" rx="6"/>
    <rect x="640" y="310" width="140" height="150" rx="6"/>
    <rect x="20" y="490" width="200" height="90" rx="6"/>
    <rect x="250" y="490" width="170" height="90" rx="6"/>
    <rect x="600" y="500" width="180" height="80" rx="6"/>
  </g>

  <!-- verde -->
  <path d="M340 380 q60 -30 110 10 q20 60 -20 100 q-60 30 -100 -10 q-30 -50 10 -100z" fill="#DDE2CB"/>
  <circle cx="680" cy="230" r="0" fill="#DDE2CB"/>
  <rect x="400" y="110" width="120" height="50" rx="6" fill="#DDE2CB"/>

  <!-- canale -->
  <path d="M-20 470 C 120 430, 200 520, 330 470 S 560 420, 640 480 S 760 560, 830 520"
        fill="none" stroke="#D3DCDA" stroke-width="22" stroke-linecap="round"/>

  <!-- strade secondarie -->
  <g fill="none" stroke="#FBF8F2" stroke-width="12" stroke-linecap="round">
    <path d="M185 0 V600"/>
    <path d="M385 0 V330"/>
    <path d="M540 0 V600"/>
    <path d="M0 150 H800"/>
    <path d="M0 330 H460"/>
    <path d="M600 290 H800"/>
    <path d="M0 470 H800"/>
    <path d="M440 330 L 460 600"/>
  </g>
  <g fill="none" stroke="#E2D6BF" stroke-width="1.2">
    <path d="M179 0 V600 M191 0 V600"/>
    <path d="M534 0 V600 M546 0 V600"/>
    <path d="M0 144 H800 M0 156 H800"/>
  </g>

  <!-- strada principale -->
  <path d="M-20 600 C 150 460, 260 330, 400 300 S 650 230, 820 110"
        fill="none" stroke="#E2D6BF" stroke-width="26" stroke-linecap="round"/>
  <path d="M-20 600 C 150 460, 260 330, 400 300 S 650 230, 820 110"
        fill="none" stroke="#F7EED9" stroke-width="20" stroke-linecap="round"/>
  <path d="M-20 600 C 150 460, 260 330, 400 300 S 650 230, 820 110"
        fill="none" stroke="#D9BC7A" stroke-width="2" stroke-dasharray="14 12" opacity="0.7"/>
</svg>
